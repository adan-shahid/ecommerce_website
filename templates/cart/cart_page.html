{% extends 'base.html' %}

{% include 'navbar.html' %}

{% block content %}

<div class="container py-5">
    <h2 class="mb-4 fw-bold">Your Shopping Cart</h2>
    
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4">
                
                <div class="row align-items-center mb-4 pb-4 border-bottom">
                    <div class="col-3 col-md-2">
                        <img src="https://via.placeholder.com/100" class="img-fluid rounded" alt="Product">
                    </div>
                    <div class="col-9 col-md-4">
                        <h5 class="fw-bold mb-1">Premium Product Title</h5>
                        <p class="text-muted small mb-0">Size: M | Color: Black</p>
                    </div>
                    <div class="col-6 col-md-3 mt-3 mt-md-0">
                        <div class="input-group input-group-sm" style="max-width: 100px;">
                            <button class="btn btn-outline-secondary" type="button"><i class="bi bi-minus"></i></button>
                            <input type="text" class="form-control text-center" value="1" readonly>
                            <button class="btn btn-outline-secondary" type="button"><i class="bi bi-plus"></i></button>
                        </div>
                    </div>
                    <div class="col-4 col-md-2 text-end mt-3 mt-md-0">
                        <span class="fw-bold text-dark">$49.99</span>
                    </div>
                    <div class="col-2 col-md-1 text-end mt-3 mt-md-0">
                        <button class="btn btn-link text-danger p-0"><i class="bi bi-trash fs-5"></i></button>
                    </div>
                </div>
                </div>
            
            <a href="#" class="btn btn-link text-muted p-0 mt-3"><i class="bi bi-arrow-left"></i> Continue Shopping</a>
        </div>

        # Right Side: Order Summary Card
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 position-sticky" style="top: 20px;">
                <h4 class="fw-bold mb-4">Order Summary</h4>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Subtotal</span>
                    <span class="fw-semibold">$49.99</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Shipping</span>
                    <span class="text-success fw-semibold">Free</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold fs-5">Total</span>
                    <span class="fw-bold fs-5 text-primary">$49.99</span>
                </div>
                <button class="btn btn-primary w-100 py-2 fw-semibold">Proceed to Checkout</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}
