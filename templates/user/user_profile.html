{% extends 'base.html' %}

{% include 'navbar.html' %}

{% block content %}


<div class="container mt-5">
    <div class="row">
        
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <img src="https://via.placeholder.com/150" alt="Profile Picture" class="rounded-circle img-fluid mb-3" style="width: 150px;">
                    <h4 class="card-title">John Doe</h4>
                    <p class="text-muted">john.doe@example.com</p>
                    <p class="text-muted">Member since May 2026</p>
                    <button class="btn btn-primary btn-sm mt-2">Change Avatar</button>
                </div>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Account Details</h5>
                </div>
                <div class="card-body">
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" value="John">
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" value="Doe">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" value="john.doe@example.com" disabled>
                            <div class="form-text">To change your email, please contact support.</div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" placeholder="+1 234 567 8900">
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Shipping Address</label>
                            <textarea class="form-control" id="address" rows="3" placeholder="Enter your default shipping address"></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-success">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
        
    </div>
</div>


{% endblock %}
