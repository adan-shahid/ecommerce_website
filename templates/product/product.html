{% extends "base.html" %}

{% block content %}
<h2>Below are the Available products. </h2>


<div class="container py-5">
    <h2 class="mb-4">Top Sellers</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        
        <div class="col">
            <div class="card h-100 position-relative">
                <div class="badge bg-danger position-absolute top-0 start-0 m-2">SALE</div>
                <button class="btn btn-light btn-sm position-absolute top-0 end-0 m-2 rounded-circle shadow-sm">
                    <i class="fa-regular fa-heart text-muted"></i>
                </button>
                
                <img src="https://via.placeholder.com/300x250" class="card-img-top p-3" alt="Product Image">
                <div class="card-body">
                    <div class="text-warning mb-1 small">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star-half-stroke"></i>
                        <span class="text-muted ms-1">(4.5)</span>
                    </div>
                    <h6 class="card-title text-truncate">Wireless Noise-Cancelling Headphones</h6>
                    <div class="mb-3">
                        <span class="fs-5 fw-bold text-dark">$129.00</span>
                        <span class="text-muted text-decoration-line-through ms-2 small">$199.00</span>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-top-0 pb-3">
                    <button class="btn btn-primary w-100">
                        <i class="fa-solid fa-cart-shopping me-2"></i> Add to Cart
                    </button>
                </div>
            </div>
        </div>

        </div>
</div>
