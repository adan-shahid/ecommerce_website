{% extends "base.html" %}

{% block content %}


<div class="container py-5">
    <h2 class="text-center mb-5">Below are the Available Products</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4"> 
            {% for product in products %}
   
        <div class="col">
            <div class="card h-100 border-0 shadow-sm">
                <img src="{{product.image.url }}" class="card-img-top rounded-0" alt="Product Image">
                <div class="card-body text-center">
                    <h5 class="card-title fw-light">{{product.name}}</h5>
                    <p class="card-text fw-bold">${{product.price}}</p>

                    <div class="d-grid gap-2">
                        <a class="btn btn-dark rounded-0" href="{% url 'product-detail' product.id %}" class="text-muted text-decoration-none small">View Details</a>
                    </div>
                </div>
            </div>
        </div>
{% endfor %}
        </div>
        
</div>



{% endblock %}
