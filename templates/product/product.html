{% extends "base.html" %}

{% block content %}
<h2>Products</h2>


<div class="products">
    {% for product in products %}
        <div class="product-card">
            <!-- {% if product.image %}
                <img src="{{ product.image.url }}" width="200">
            {% endif %} -->

            <h3>{{ product.name }}</h3>
            <p>{{ product.description }}</p>
            <p>Price: ${{ product.price }}</p>
        </div>
    {% endfor %}
</div>

{% endblock %}
